

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf1ff">
<title>Puhnet AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:linear-gradient(160deg,#eaf1ff,#f1edff);
 font-family:Arial,sans-serif;color:#29364d;min-height:100vh;
 display:flex;justify-content:center;
}
button,input{font:inherit}
.app{
 width:100%;max-width:520px;min-height:100dvh;
 display:flex;flex-direction:column;padding:12px;gap:10px;
}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 5px}
header h2{margin:0;font-size:22px}
.header-buttons{display:flex;gap:7px}
button{
 border:0;border-radius:15px;padding:12px 15px;
 background:white;color:#33415c;font-weight:bold;
 cursor:pointer;box-shadow:0 3px 10px #9eb4d333;
}
button:active{transform:scale(.96)}
#sound,#clearChat{font-size:19px;padding:9px 12px}
.pet-area{
 flex:0 0 245px;display:flex;align-items:center;
 justify-content:center;position:relative;overflow:hidden;
}
.cloud{
 position:relative;width:165px;height:115px;
 border-radius:48% 48% 43% 43%;
 background:
  radial-gradient(ellipse at 50% 75%,#ff9cc9 0%,transparent 37%),
  linear-gradient(145deg,#8798ff 0%,#5365ff 35%,#2938d4 75%,#202ba8 100%);
 box-shadow:0 0 18px #5365ff99,0 0 35px #5365ff77,
 inset 5px 7px 15px #ffffff66,inset -8px -12px 18px #1928a988;
 animation:float 3.5s ease-in-out infinite;
 transition:filter .3s;
}
.cloud:before,.cloud:after{
 content:"";position:absolute;border-radius:50%;
 background:linear-gradient(145deg,#7285ff,#3546df 75%);
 box-shadow:inset 4px 5px 12px #ffffff55,0 0 16px #5365ff88;
}
.cloud:before{width:75px;height:75px;left:-12px;top:27px}
.cloud:after{width:72px;height:72px;right:-12px;top:27px}
.face{position:absolute;z-index:3;inset:0}
.eye{
 position:absolute;top:37px;width:9px;height:24px;
 background:white;border-radius:10px;
 box-shadow:0 0 9px #ffffffbb;transform:rotate(19deg);
 transition:.25s;
}
.eye.left{left:62px}
.eye.right{right:62px}
@keyframes float{
 0%,100%{transform:translateY(0) rotate(0)}
 50%{transform:translateY(-9px) rotate(1deg)}
}
.cloud.angry .eye,.cloud.rage .eye{height:17px;transform:rotate(35deg)}
.cloud.sad .eye,.cloud.crying .eye{height:14px;transform:rotate(-15deg)}
.cloud.happy .eye,.cloud.laughing .eye{height:7px;transform:rotate(0)}
.cloud.love .eye{height:20px;transform:rotate(25deg)}
.cloud.cold{filter:hue-rotate(15deg) brightness(1.2)}
.cloud.party{filter:brightness(1.2) drop-shadow(0 0 12px #a3aaff)}
.cloud.angry,.cloud.rage{filter:hue-rotate(-20deg) drop-shadow(0 0 12px #ff526f)}
.cloud.tender{filter:brightness(1.08)}
.cloud.angel{filter:brightness(1.2) drop-shadow(0 0 10px white)}
.cloud.smirk .eye.right{transform:rotate(40deg);height:13px}
.cloud.wink .eye.right{height:3px;top:47px}
.cloud.rage{animation:rage .15s infinite}
@keyframes rage{
 0%,100%{transform:translateX(-2px) rotate(-2deg)}
 50%{transform:translateX(2px) rotate(2deg)}
}
.chat{
 flex:1;min-height:150px;max-height:340px;overflow-y:auto;
 background:#ffffffa8;border:1px solid white;border-radius:20px;
 padding:12px;display:flex;flex-direction:column;gap:10px;
}
.msg{
 max-width:85%;padding:11px 14px;border-radius:17px;
 line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap;
}
.user{align-self:flex-end;background:#dceaff;border-bottom-right-radius:5px}
.bot{align-self:flex-start;background:white;border-bottom-left-radius:5px;font-size:23px}
.system{align-self:center;font-size:13px;color:#8190a7;text-align:center}
.input-area{display:flex;gap:8px}
input{
 min-width:0;flex:1;border:0;border-radius:15px;
 padding:14px;font-size:16px;outline:none;
 box-shadow:0 3px 10px #9eb4d333;
}
#send{background:#8db8ff;color:white;font-size:17px}
.hint{text-align:center;color:#8a98ad;font-size:12px;margin-top:-4px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.actions button{padding:12px 4px;font-size:12px}
.hidden{display:none!important}
.game{background:white;border-radius:18px;padding:14px;text-align:center}
.game h3{margin:0 0 10px}
.game .big{font-size:36px;margin:12px}
.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.choices button{font-size:27px;padding:12px}
@media(max-height:700px){
 .pet-area{flex-basis:190px}
 .cloud{transform:scale(.9)}
}
</style>
</head>
<body>
<div class="app">
<header>
 <h2>☁️ Puhnet AI</h2>
 <div class="header-buttons">
  <button id="clearChat" title="Очистить историю">🗑️</button>
  <button id="sound" title="Звук">🔊</button>
 </div>
</header>

<section class="pet-area">
 <div class="cloud happy" id="cloud">
  <div class="face">
   <div class="eye left"></div>
   <div class="eye right"></div>
  </div>
 </div>
</section>

<section class="chat" id="chat"></section>

<div class="game hidden" id="game"></div>

<div class="input-area">
 <input id="message" placeholder="Напиши Пухнету..." autocomplete="off">
 <button id="send">➤</button>
</div>

<div class="hint">Пухнет всегда рад общению ☁️</div>

<div class="actions" id="actions">
 <button id="feed">🍪 Покормить</button>
 <button id="pet">💗 Погладить</button>
 <button id="rebus">🧩 Ребус</button>
 <button id="rps">✊ КНБ</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const cloud=$("cloud"),chat=$("chat"),game=$("game");
const actions=$("actions"),input=$("message");

const STORAGE_KEY="puhnet_ai_local_chat_v1";
let soundOn=true,busy=false,cookies=3;
let gameMode="",puzzleIndex=0,userWins=0,botWins=0;
let audioCtx=null;

let memory={
 cookiesStolen:false,complimented:false,fed:false,lastMood:"happy"
};

/* ЛОКАЛЬНАЯ ПАМЯТЬ ЧАТА */
function saveChat(){
 try{
  const messages=[...chat.children].map(el=>({
   type:el.classList.contains("user")?"user":
        el.classList.contains("bot")?"bot":"system",
   text:el.textContent
  }));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(messages.slice(-200)));
 }catch(e){}
}

function loadChat(){
 try{
  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved){
   const messages=JSON.parse(saved);
   if(Array.isArray(messages)){
    messages.slice(-200).forEach(m=>{
     if(typeof m.text==="string"&&["user","bot","system"].includes(m.type)){
      addMessage(m.text,m.type,false);
     }
    });
   }
  }
 }catch(e){
  localStorage.removeItem(STORAGE_KEY);
 }
 if(!chat.children.length){
  addMessage("Пухнет проснулся!","system",false);
  addMessage("🥹👋","bot",false);
  saveChat();
 }
 scrollChat();
}

function clearChat(){
 if(!confirm("Очистить всю локальную историю чата?"))return;
 localStorage.removeItem(STORAGE_KEY);
 chat.innerHTML="";
 addMessage("История очищена. Пухнет снова готов общаться!","system");
 addMessage("☁️👀","bot");
}

/* ЗВУКИ */
function getAudio(){
 if(!audioCtx){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  audioCtx=new C();
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
 return audioCtx;
}

function note(freq,delay,duration,volume=.045,type="sine",endFreq=null){
 if(!soundOn)return;
 const ctx=getAudio();if(!ctx)return;
 const start=ctx.currentTime+delay;
 const osc=ctx.createOscillator(),gain=ctx.createGain();
 osc.type=type;
 osc.frequency.setValueAtTime(freq,start);
 if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,start+duration);
 gain.gain.setValueAtTime(.001,start);
 gain.gain.exponentialRampToValueAtTime(volume,start+.025);
 gain.gain.exponentialRampToValueAtTime(.001,start+duration);
 osc.connect(gain);gain.connect(ctx.destination);
 osc.start(start);osc.stop(start+duration+.03);
}

function chord(notes,spacing=.09){
 notes.forEach((n,i)=>note(n,i*spacing,.24,.035,"sine"));
}

function playSound(name){
 if(!soundOn)return;
 switch(name){
  case "happy":
  case "love":
   note(523,0,.18,.05,"sine",659);
   note(659,.13,.2,.05,"sine",784);
   note(784,.28,.28,.045,"sine",988);
   break;
  case "party":
  case "win":
   [523,659,784,1047].forEach((n,i)=>note(n,i*.11,.22,.05,"triangle"));
   break;
  case "laughing":
   for(let i=0;i<4;i++){
    note(600+(i%2)*150,i*.16,.12,.04,"triangle",850);
   }
   break;
  case "sad":
   note(440,0,.35,.045,"sine",370);
   note(370,.3,.4,.04,"sine",294);
   break;
  case "crying":
   note(620,0,.28,.04,"sine",420);
   note(520,.25,.3,.035,"sine",350);
   note(440,.52,.35,.03,"sine",300);
   break;
  case "angry":
  case "rage":
   note(160,0,.24,.04,"sawtooth",100);
   note(125,.2,.25,.035,"triangle",80);
   break;
  case "cold":
   note(1200,0,.12,.025,"sine",850);
   note(950,.17,.15,.03,"sine",1300);
   break;
  case "angel":
   chord([659,784,988],.16);
   break;
  case "smirk":
  case "wink":
   note(700,0,.12,.04,"sine",950);
   note(550,.17,.18,.035,"triangle",700);
   break;
  case "feed":
   note(420,0,.1,.04,"sine",560);
   note(560,.12,.14,.045,"sine",740);
   note(740,.25,.18,.04,"sine",880);
   break;
  case "pet":
   note(520,0,.2,.04,"sine",680);
   note(680,.16,.25,.04,"sine",850);
   break;
  case "click":
   note(650,0,.055,.025,"sine",450);
   break;
  case "lose":
   note(440,0,.22,.04,"sine",330);
   note(330,.2,.3,.035,"sine",220);
   break;
 }
}

$("sound").onclick=()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊":"🔇";
 if(soundOn)playSound("click");
};

$("clearChat").onclick=clearChat;

function mood(name){
 cloud.className="cloud "+name;
 memory.lastMood=name;
 playSound(name);
}

/* ЧАТ */
function addMessage(text,type="bot",save=true){
 const el=document.createElement("div");
 el.className=type==="user"?"msg user":type==="system"?"system":"msg bot";
 el.textContent=text;
 chat.appendChild(el);
 scrollChat();
 if(save)saveChat();
}

function addUser(text){addMessage(text,"user")}
function addBot(text){addMessage(text,"bot")}
function system(text){addMessage(text,"system")}

function scrollChat(){chat.scrollTop=chat.scrollHeight}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function normalize(s){
 return s.toLowerCase().replace(/ё/g,"е").trim();
}

/* ЭМОЦИИ И РЕАКЦИИ */
function isInsultDirectedAtPuhnet(text){
 const words=normalize(text).match(/[а-яa-z0-9-]+/g)||[];
 const insults=["лох","идиот","дебил","дурак","тупой","тупая",
 "тупица","придурок","кретин","урод","глупый","глупая"];
 const targets=["ты","тебя","тебе","тобой","твой","твоя",
 "твое","твои","пухнет","пухнета","пухнету"];
 return words.some(w=>targets.includes(w))&&
 words.some(w=>insults.some(b=>w===b));
}

async function understand(raw){
 const t=normalize(raw);

 if(/съел.*печень|съела.*печень|забрал.*печень|украл.*печень/.test(t)){
  memory.cookiesStolen=true;
  mood("rage");await delay(700);
  mood("crying");addBot("🤬😭");
  await delay(600);mood("sad");return;
 }

 if(isInsultDirectedAtPuhnet(t)){
  mood("angry");await delay(700);
  mood("crying");addBot("🤬😭💔");
  await delay(600);mood("sad");return;
 }

 if(/прости|извини|не хотел|не хотела/.test(t)){
  mood("tender");addBot(memory.cookiesStolen?"🥺💗":"😇💗");
  memory.cookiesStolen=false;return;
 }

 if(/люблю тебя|ты классный|ты хороший|молодец|умный|красивый|ты лучший|спасибо/.test(t)){
  memory.complimented=true;mood("love");addBot("🥹💗");return;
 }

 if(/шутка|смешно|ха-ха|ахах|хах/.test(t)){
  mood("laughing");addBot("😂🤣");return;
 }

 if(/грустно|плохо|печально|я расстроен|я расстроена/.test(t)){
  mood("tender");addBot("🥺💗");return;
 }

 if(/злюсь|бесит|раздражает|я зол|я зла/.test(t)){
  mood("sad");addBot("🥺");return;
 }

 if(/привет|здравствуй|хай|ку\b/.test(t)){
  mood("happy");addBot("👋🥰");return;
 }

 if(/как дела|как ты|что делаешь/.test(t)){
  mood("happy");addBot("🥰✨");return;
 }

 if(/спишь|спокойной ночи/.test(t)){
  mood("angel");addBot("😴💤");return;
 }

 if(/пока|до свидания/.test(t)){
  mood("sad");addBot("👋🥺");return;
 }

 if(/думаешь|не знаешь|почему/.test(t)){
  mood("smirk");addBot("🤔💭");return;
 }

 if(/печеньк|печенье/.test(t)){
  mood("happy");addBot(memory.cookiesStolen?"🥺🍪":"🍪😍");return;
 }

 if(/ура|победа|круто/.test(t)){
  mood("party");addBot("🥳🎉");return;
 }

 const reactions=[
  ["happy","🥰"],["wink","😉✨"],["cold","🥶❄️"],
  ["tender","🥹💗"],["angel","😇✨"],["party","🥳🎉"],
  ["smirk","😏"],["laughing","😂🤣"]
 ];
 const r=reactions[Math.floor(Math.random()*reactions.length)];
 mood(r[0]);addBot(r[1]);
}

/* ОТПРАВКА */
async function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 input.value="";
 addUser(text);
 playSound("click");

 if(!game.classList.contains("hidden")){
  if(gameMode==="rebus")checkRebus(text);
  return;
 }
 if(busy){addBot("😤");return;}
 busy=true;
 await understand(text);
 busy=false;
}

$("send").onclick=sendMessage;
input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

/* КОРМЛЕНИЕ И ПОГЛАЖИВАНИЕ */
async function feed(){
 if(busy||!game.classList.contains("hidden"))return;
 if(cookies<=0){mood("sad");addBot("🥺🍪");return;}
 cookies--;memory.fed=true;
 mood("happy");addBot("😍🍪");
 await delay(350);mood("love");addBot("🥰💗");
}
$("feed").onclick=feed;

function pet(){
 if(busy||!game.classList.contains("hidden"))return;
 mood("love");addBot("🥰💗");
 cloud.animate([
  {transform:"scale(1)"},{transform:"scale(1.1)"},
  {transform:"scale(.98)"},{transform:"scale(1)"}
 ],{duration:500});
}
$("pet").onclick=pet;

/* РЕБУСЫ */
const puzzles=[
 ["🐈‍⬛👢",["кот в сапогах","котвсапогах"]],
 ["🕷️🦸‍♂️🕸️",["человек паук","человек-паук","человекпаук"]],
 ["❄️👸",["снежная королева","снежнаякоролева"]],
 ["🐸👑",["царевна лягушка","царевна-лягушка"]],
 ["🍋🥤",["лимонад"]],
 ["🎄🎁",["новый год","новыйгод"]],
 ["🌈🌧️",["радуга"]],
 ["🐻🍯",["винни пух","винни-пух","виннипух"]],
 ["🚀🌌",["космос"]],
 ["🐔🥚",["яйцо"]],
 ["🧊🏠",["иглу"]],
 ["🦋🌸",["бабочка"]],
 ["🐟🌊",["рыба"]],
 ["🌙⭐",["ночь"]],
 ["🍎🥧",["яблочный пирог","яблочныйпирог"]],
 ["🐰🥕",["заяц"]],
 ["🐱🐭",["кот и мышь","котимышь"]],
 ["🐝🍯",["мед","мёд"]],
 ["🐢🏁",["черепаха"]],
 ["☀️🌻",["подсолнух"]]
];

function startRebus(){
 if(busy)return;
 gameMode="rebus";puzzleIndex=0;
 actions.classList.add("hidden");
 game.classList.remove("hidden");
 showPuzzle();
}

function showPuzzle(){
 game.innerHTML="<h3>🧩 Угадай ребус!</h3>"+
 '<div class="big">'+puzzles[puzzleIndex][0]+"</div>"+
 "<div>Напиши ответ в поле ниже</div>"+
 '<div style="margin-top:8px;color:#91a0b4;font-size:12px">'+
 (puzzleIndex+1)+" / "+puzzles.length+"</div>";
 mood("happy");
}

function checkRebus(answer){
 const a=normalize(answer).replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
 if(puzzles[puzzleIndex][1].some(x=>normalize(x)===a)){
  mood("party");addBot("🥳🎉💗");puzzleIndex++;
  if(puzzleIndex>=puzzles.length){
   gameMode="";game.classList.add("hidden");
   actions.classList.remove("hidden");
   system("Все ребусы разгаданы!");
   mood("party");addBot("🏆🥳💗");
  }else setTimeout(showPuzzle,800);
 }else{
  mood("sad");addBot("🤔❓");
 }
}

/* КАМЕНЬ, НОЖНИЦЫ, БУМАГА */
const moves=["✊","✌️","🖐️"];

function startRPS(){
 if(busy)return;
 gameMode="rps";userWins=0;botWins=0;
 actions.classList.add("hidden");
 game.classList.remove("hidden");
 renderRPS();mood("happy");
}

function renderRPS(){
 game.innerHTML="<h3>✊ Камень, ножницы, бумага</h3>"+
 "<p>Кто первым наберёт 3 победы?</p>"+
 '<div id="score">Ты '+userWins+" : "+botWins+" Пухнет</div>"+
 '<div class="choices">'+
 '<button data-move="0">✊</button>'+
 '<button data-move="1">✌️</button>'+
 '<button data-move="2">🖐️</button></div>';
 game.querySelectorAll("[data-move]").forEach(b=>{
  b.onclick=()=>playRPS(Number(b.dataset.move));
 });
}

function playRPS(user){
 if(gameMode!=="rps")return;
 const bot=Math.floor(Math.random()*3);
 let result;
 if(user===bot){
  result="🤝😐";mood("tender");
 }else if((user-bot+3)%3===1){
  userWins++;result=moves[bot]+"😭";mood("party");playSound("win");
 }else{
  botWins++;result=moves[bot]+"😎";mood("smirk");playSound("lose");
 }
 addBot(result);
 if(userWins>=3||botWins>=3){
  const won=userWins>=3;gameMode="";
  setTimeout(()=>{
   game.classList.add("hidden");actions.classList.remove("hidden");
   system(won?"Ты победил!":"Пухнет победил!");
   mood(won?"party":"happy");addBot(won?"🏆🥳":"😎🏆");
  },700);
 }else{
  renderRPS();
 }
}

$("rebus").onclick=startRebus;
$("rps").onclick=startRPS;

/* ЗАПУСК */
loadChat();
</script>
</body>
</html>
